[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-preprocessor"
version = "0.1.0"
description = "Detect, read, normalize, and patchify SAR datasets (Sentinel-1, DSIFN, UAVSAR, AIRSAR) into PNG patches."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hema Siri Guduru" }]
keywords = ["sar", "remote-sensing", "preprocessing", "dsifn", "sentinel-1", "uavsar", "airsar"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# NOTE: numpy and tqdm are confirmed dependencies (used directly in
# build_dataset.py / scene.py). Verify and add whatever export.py,
# normalize.py, and the readers/ modules actually import at runtime
# (e.g. rasterio or Pillow for raster/PNG I/O) -- those weren't
# available to check when this file was put together.
dependencies = [
    "numpy>=1.23",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sar-preprocessor = "sar_preprocessor.build_dataset:main"

[project.urls]
Repository = "https://github.com/hemasiri-15/SAR-DDPM"

[tool.setuptools.packages.find]
include = ["sar_preprocessor*"]
